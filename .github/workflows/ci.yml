name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/mobile-presentation-release-20261112

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: caloriebank
          POSTGRES_PASSWORD: caloriebank
          POSTGRES_DB: caloriebank_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caloriebank -d caloriebank_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      EXPO_NO_TELEMETRY: '1'
      DATABASE_URL: postgresql://caloriebank:caloriebank@127.0.0.1:5432/caloriebank_test
      TEST_DATABASE_URL: postgresql://caloriebank:caloriebank@127.0.0.1:5432/caloriebank_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Root engines.node is >=20.19.0 <21. Pin the documented minimum.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Show toolchain
        run: node -v && npm -v

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run db:deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
